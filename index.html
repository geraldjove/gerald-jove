<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Gerald Jove - Web Developer | Multimedia Artist</title>
    <meta
      name="description"
      content="Gerald Jove — 3D artist and multimedia designer based in Metro Manila. Product visualisation, animation, motion graphics, and web development."
    />

    <!--
      No canonical or og:url here on purpose. This is a client-rendered SPA, so a single
      static canonical would label /about, /works and /contact as the homepage — worse than
      having none. Per-route canonicals land with prerendering in the rebuild.
    -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Gerald Jove" />
    <meta property="og:title" content="Gerald Jove — 3D Artist & Multimedia Designer" />
    <meta
      property="og:description"
      content="Product visualisation, animation, motion graphics, and web development. Based in Metro Manila."
    />
    <meta property="og:image" content="/logo.png" />

    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Gerald Jove — 3D Artist & Multimedia Designer" />
    <meta
      name="twitter:description"
      content="Product visualisation, animation, motion graphics, and web development. Based in Metro Manila."
    />
    <meta name="twitter:image" content="/logo.png" />
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
